    <script>
      (function() {
        try {
          var nativeFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var currentFetch = nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
              if (protoDesc && protoDesc.configurable) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() {
                    return currentFetch;
                  },
                  set: function(fn) {
                    currentFetch = fn;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (_) {}
          }

          // Suppress benign AbortError / "signal is aborted without reason"
          window.addEventListener('unhandledrejection', function(event) {
            var reason = event.reason;
            var msg = reason ? (reason.message || String(reason)) : '';
            if (
              (reason && reason.name === 'AbortError') ||
              msg.indexOf('aborted') !== -1 ||
              msg.indexOf('signal is aborted') !== -1
            ) {
              event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            }
          });

          window.addEventListener('error', function(event) {
            var msg = event.message || '';
            if (msg.indexOf('aborted') !== -1 || msg.indexOf('signal is aborted') !== -1) {
              event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            }
          });
        } catch (e) {
          console.warn('Fetch setter shim error:', e);
        }
      })();
    </script>
